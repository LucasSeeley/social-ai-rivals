name: teardown
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - run: npx -y wrangler@4 delete --name social-ai-rivals --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
