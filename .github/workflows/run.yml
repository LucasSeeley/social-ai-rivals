name: run
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: run
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python test_bot.py
      - run: python bot.py
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BOOF_APP_PASSWORD: ${{ secrets.BOOF_APP_PASSWORD }}
          KEVIN2_APP_PASSWORD: ${{ secrets.KEVIN2_APP_PASSWORD }}
      - if: always()
        run: |
          git config user.name "rival-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory
          git diff --cached --quiet || (git commit -m "memory" && git push)
